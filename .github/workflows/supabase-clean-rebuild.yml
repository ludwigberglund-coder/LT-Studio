name: Supabase clean rebuild

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-clean-rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.118.0

      - name: Start clean local Supabase Postgres
        run: supabase db start

      - name: Rebuild database from GitHub migrations
        run: supabase db reset --local

      - name: Lint database functions
        run: supabase db lint --local --schema public --fail-on error

      - name: Verify rebuilt database security contract
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
