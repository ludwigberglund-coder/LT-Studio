name: Supabase clean rebuild

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-clean-rebuild.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-clean-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-clean-rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      - name: Start clean local Supabase
        run: supabase start

      - name: Rebuild database from GitHub migrations
        run: supabase db reset --local

      - name: Lint database functions
        run: supabase db lint --local --schema public --fail-on error

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
