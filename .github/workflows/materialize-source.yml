name: Materialize source archive

on:
  push:
    paths:
      - .github/workflows/materialize-source.yml

permissions:
  contents: write

concurrency:
  group: materialize-source
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and materialize source files
        shell: bash
        run: |
          set -Eeuo pipefail

          archive="$RUNNER_TEMP/rollands-source.tar.xz"
          extract_dir="$RUNNER_TEMP/rollands-source"
          file_list="$RUNNER_TEMP/rollands-source-files.txt"

          mapfile -t parts < <(
            find source-export -maxdepth 1 -type f \
              -name 'rollands-source.tar.xz.b64.part*' -print | sort
          )

          if [ "${#parts[@]}" -eq 0 ]; then
            echo "No source archive parts were found." >&2
            exit 1
          fi

          cat "${parts[@]}" | tr -d '\r\n' | base64 --decode > "$archive"

          expected_sha="$(awk 'NR == 1 { print $1 }' source-export/SHA256SUMS.txt)"
          actual_sha="$(sha256sum "$archive" | awk '{ print $1 }')"

          if [ -z "$expected_sha" ] || [ "$actual_sha" != "$expected_sha" ]; then
            echo "Source archive checksum mismatch." >&2
            echo "Expected: $expected_sha" >&2
            echo "Actual:   $actual_sha" >&2
            exit 1
          fi

          tar -tJf "$archive" > "$file_list"

          if grep -Eq '(^/|(^|/)\.\.(/|$))' "$file_list"; then
            echo "Unsafe path found in source archive." >&2
            exit 1
          fi

          mkdir -p "$extract_dir"
          tar -xJf "$archive" \
            --directory "$extract_dir" \
            --no-same-owner \
            --no-same-permissions

          if find "$extract_dir" \
            \( -type l -o -type b -o -type c -o -type p -o -type s \) \
            -print -quit | grep -q .; then
            echo "Unsupported special file found in source archive." >&2
            exit 1
          fi

          mapfile -t top_entries < <(find "$extract_dir" -mindepth 1 -maxdepth 1 -print)
          source_dir="$extract_dir"
          if [ "${#top_entries[@]}" -eq 1 ] && [ -d "${top_entries[0]}" ]; then
            source_dir="${top_entries[0]}"
          fi

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='source-export/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='store.json' \
            "$source_dir/" ./

          test -f server.js
          test -f invoice-pdf.js
          test -d public
          test -d test

      - name: Commit materialized source
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "Source files are already materialized."
            exit 0
          fi

          git commit -m "chore: materialize source archive"
          git push origin "HEAD:${GITHUB_REF_NAME}"
