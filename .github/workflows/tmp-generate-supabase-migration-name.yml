name: Temporary generate Supabase migration name

on:
  push:
    branches:
      - fix/supabase-rls-initplan-phase2

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0
      - name: Generate phase 2 migration
        run: |
          supabase migration new rls_advisor_performance_cleanup_phase2
          find supabase/migrations -maxdepth 1 -type f -name '*_rls_advisor_performance_cleanup_phase2.sql' -printf '%f\n'
