name: Quality and security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . \
            -path './node_modules' -prune -o \
            -path './dist' -prune -o \
            -path './source-export' -prune -o \
            -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) \
            -print0)

      - name: Run automated tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build static site
        run: npm run build:static

      - name: Verify generated site
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/finance.js
          diff -qr public dist

      - name: Create review snapshot
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/rollands-review"
          rsync -a \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='source-export/' \
            --exclude='store.json' \
            --exclude='.env' \
            --exclude='.env.*' \
            ./ "$RUNNER_TEMP/rollands-review/"

      - name: Upload review snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollands-review-source
          path: ${{ runner.temp }}/rollands-review
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
