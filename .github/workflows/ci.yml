name: Quality and security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate editable content
        run: npm run content:check
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . \
            -path './node_modules' -prune -o \
            -path './dist' -prune -o \
            -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) \
            -print0)
      - name: Run automated tests
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build static demo
        run: npm run build:static
      - name: Verify generated demo
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/styles.css
          test -f dist/admin/index.html
          test -f dist/admin/app.js
          test -f dist/shared/content.js
          test -f dist/content/company.json
          test -f dist/content/site.json
          test -f dist/content/admin.json
          test -f dist/config/rolands-business-decisions.json
          test -f dist/legacy/index.html
          test -f dist/.nojekyll
          test ! -e dist/store.json
          test ! -e dist/.env
      - name: Install Chromium test runtime
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Run supplier invoice browser flow
        run: npm run test:browser:payables
      - name: Run complete navigation and invoice browser flow
        run: node test/menu-invoice-browser.cjs
      - name: Upload invoice and navigation review artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rollands-invoice-navigation-qa
          path: test-artifacts/
          if-no-files-found: warn
          retention-days: 7
      - name: Create review snapshot
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/rollands-review"
          rsync -a \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='test-artifacts/' \
            --exclude='store.json' \
            --exclude='store.json.bak' \
            --exclude='*.corrupt-*' \
            --exclude='server.lock' \
            --exclude='backups/' \
            --exclude='.env' \
            --exclude='.env.*' \
            ./ "$RUNNER_TEMP/rollands-review/"
      - name: Upload review snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rollands-review-source
          path: ${{ runner.temp }}/rollands-review
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
