name: Publish GitHub Pages demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Scan full Git history for high-confidence secrets
        run: npm run security:history-scan

      - name: Scan browser source for secrets
        run: npm run security:client-scan

      - name: Block dangerous runtime code execution primitives
        run: npm run security:runtime-code-scan

      - name: Enforce GitHub Actions trust boundary
        run: npm run security:ci-trust-boundary

      - name: Validate editable content
        run: npm run content:check

      - name: Run automated tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build static demo
        run: npm run build:static

      - name: Scan generated browser artifacts for secrets
        run: npm run security:client-scan

      - name: Verify generated demo contains no private runtime files
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/styles.css
          test ! -e dist/store.json
          test ! -e dist/.env
          test ! -e dist/platform.sqlite
          test ! -e dist/backups
          if find dist -type f \( -name '*.sqlite' -o -name '*.sqlite-*' -o -name '*.db' -o -name '*.env' -o -name '*.bak' \) -print -quit | grep -q .; then
            echo 'Private runtime file found in Pages artifact.' >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
