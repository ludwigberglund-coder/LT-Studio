name: Apply audited hardening patch

on:
  push:
    branches:
      - hardening/accounting-integrity-2026-09-15
    paths:
      - .bootstrap/**
      - .github/workflows/apply-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out review branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify and apply reviewed patch
        shell: bash
        run: |
          set -Eeuo pipefail

          encoded="$RUNNER_TEMP/rollands-hardening.patch.gz.b64"
          archive="$RUNNER_TEMP/rollands-hardening.patch.gz"
          patch="$RUNNER_TEMP/rollands-hardening.patch"

          mapfile -t parts < <(find .bootstrap -maxdepth 1 -type f -name 'hardening.patch.gz.b64.part*' -print | sort)
          if [ "${#parts[@]}" -ne 9 ]; then
            echo "Expected exactly nine patch parts, found ${#parts[@]}." >&2
            exit 1
          fi

          cat "${parts[@]}" | tr -d '\r\n' > "$encoded"
          printf '%s  %s\n' '0d512848e89856796cc7613bb3dbb6fce32a2be8bbf46694d9afcb398ccd6889' "$encoded" | sha256sum --check --strict

          base64 --decode "$encoded" > "$archive"
          printf '%s  %s\n' '6ee474d56c64768bdacf47cb2b82fcccd5872f09dd12b43481266a9973d74937' "$archive" | sha256sum --check --strict

          gzip --decompress --stdout "$archive" > "$patch"
          printf '%s  %s\n' 'd7a4d2750f1a35c85bf4b1db1b9710d6946b555388c91bd5a2d4f4b7403ec759' "$patch" | sha256sum --check --strict

          git apply --check "$patch"
          git apply "$patch"
          rm -rf source-export .bootstrap

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . \
            -path './node_modules' -prune -o \
            -path './dist' -prune -o \
            -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) \
            -print0)

      - name: Run automated tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build and verify static site
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run build:static
          diff -qr public dist

      - name: Commit verified hardening changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "No hardening changes remained to commit."
            exit 0
          fi

          git commit -m "security: harden bookkeeping integrity and operations"
          git push origin "HEAD:${GITHUB_REF_NAME}"
